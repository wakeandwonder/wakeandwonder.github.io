<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f0eee9">
<meta name="description" content="Wake & Wonder — AI • Innovation • Data • Art. Say hello.">
<title>Wake and Wonder — Say hello</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css"><script src="assets/js/main.js" defer></script>
</head>
<body>
<header class="site-header"><a class="brand-logo-link" href="#" aria-label="Wake and Wonder home"><img class="brand-logo" src="assets/js/Wake Wonder Celestial Wordmark.png" alt="Wake and Wonder celestial logo"></a></header>
<main class="page-main">
<section class="contact-card" id="contact" aria-labelledby="contact-title">
<p class="eyebrow">SAY HELLO</p>
<h1 id="contact-title">Let's start<br><em>a conversation.</em></h1>
<p class="card-intro">A thought, a question, a collaboration — my inbox is open.</p>
<form id="contact-form" action="https://api.web3forms.com/submit" method="POST">
<input type="hidden" name="access_key" value="bbcaa887-4b4f-434a-b692-be6306bdb6fe">
<input type="hidden" name="subject" value="A new message from Wake and Wonder">
<input type="checkbox" name="botcheck" class="botcheck" tabindex="-1" autocomplete="off">
<label for="contact-name">Name</label><input id="contact-name" name="name" type="text" placeholder="Your name" autocomplete="name" required>
<label for="contact-email">Email</label><input id="contact-email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
<label for="contact-message">Message</label><textarea id="contact-message" name="message" rows="3" placeholder="What would you like to talk about?" required></textarea>
<button class="submit-button" type="submit">Send a message <span>↗</span></button>
<p class="form-status" id="form-status" role="status" aria-live="polite"></p>
</form>
</section>
</main>

</body></html>
